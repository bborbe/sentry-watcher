# maintainer-bot per-repo config (ben-s-pull-request-reviewer[bot]).
#
# autoRelease ENABLED 2026-10-08. The comment that stood here said the release
# was manual because sentry-watcher deploys via the maintainer Helm chart — but
# that chart's mirror *consumes* tags, so it argued for auto-tagging rather than
# against it. The manual step cost a real delay: the heartbeat-envelope fix
# (PR #20) merged and then sat under `## Unreleased` until someone renamed the
# heading and tagged by hand.
#
# Two facts the automation rests on, neither checkable from this repo — recorded
# so they are not re-derived: the releaser App holds bypass_mode: always on this
# repo's master-protection ruleset (verified via the GitHub rulesets API on
# 2026-10-08; same actor set as bborbe/nuke and bborbe/coding), and the deploy is
# unaffected because the CronJobs that run this image pin WATCHER_TAG explicitly
# in bborbe/nuke's sentry-heartbeat/ manifests.
prReviewer:
  autoApprove: true

release:
  autoRelease: true

# Consent for github-update-go-agent. The key must be present and explicitly
# true: the gate reads a missing key as Go's zero value (false), which silently
# ejects the repo from the fleet sweep with no failure anywhere. sentry-watcher
# was on Go 1.27.0 when this was added, so the omission was invisible — it would
# only have surfaced as a repo quietly not updating on the next Go release.
goUpdate:
  autoUpdate: true
