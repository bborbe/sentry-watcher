apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: build
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: clone
          image: alpine/git:2.47.2
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              git init /workspace
              cd /workspace
              git remote add origin "$REPO_URL"
              git fetch --depth 1 origin "$REF"
              git checkout --detach FETCH_HEAD
              git rev-parse --short HEAD > /stamps/BUILD_GIT_COMMIT
              date -u +%Y-%m-%dT%H:%M:%SZ > /stamps/BUILD_DATE
              echo "cloned $REF at $(git rev-parse HEAD)"
          env:
            - name: HOME
              value: /workspace
            - name: GIT_TERMINAL_PROMPT
              value: "0"
            - name: REPO_URL
              value: __REPO_URL__
            - name: REF
              value: __REF__
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: stamps
              mountPath: /stamps
      containers:
        - name: build
          image: moby/buildkit:v0.34.1-rootless
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export BUILD_GIT_COMMIT="$(cat /stamps/BUILD_GIT_COMMIT)"
              export BUILD_DATE="$(cat /stamps/BUILD_DATE)"
              buildctl-daemonless.sh build \
                --frontend dockerfile.v0 \
                --local context=/workspace \
                --local dockerfile=/workspace \
                --opt filename="$DOCKERFILE" \
                --opt platform=linux/amd64 \
                --opt build-arg:BUILD_GIT_COMMIT="$BUILD_GIT_COMMIT" \
                --opt build-arg:BUILD_DATE="$BUILD_DATE" \
                --output "type=image,name=$IMAGE_REF,push=true"
          env:
            - name: DOCKER_CONFIG
              value: /home/user/.docker
            - name: BUILDKITD_FLAGS
              value: --oci-worker-no-process-sandbox
            - name: DOCKERFILE
              value: __DOCKERFILE__
            - name: IMAGE_REF
              value: __IMAGE__:__TAG__
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: stamps
              mountPath: /stamps
            - name: docker-config
              mountPath: /home/user/.docker
              readOnly: true
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 5Gi
            limits:
              memory: 4Gi
              ephemeral-storage: 20Gi
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 10Gi
        - name: stamps
          emptyDir: {}
        - name: docker-config
          secret:
            secretName: __PUSH__
            items:
              - key: .dockerconfigjson
                path: config.json
