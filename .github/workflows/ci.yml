name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Branch protection on master requires a check named "test".
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The apt-repo recipe this replaced used `apt-key add`, which the runner
      # image no longer ships (Ubuntu 26.04 / "resolute" removed it), so the step
      # failed before precommit ever ran — on every PR since 2026-11-11. The
      # upstream install script pins no dist codename and needs no key handling.
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin
          trivy --version
      - name: Run precommit checks
        env:
          RACE: "false"
        run: make precommit
